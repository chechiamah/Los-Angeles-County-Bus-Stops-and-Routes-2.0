<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA County Bus Routes Map</title>

  <!-- LEAFLET CSS-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- APPEARANCE -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOADING MESSAGE -->
  <div id="loading" class="loading">Loading map data...</div>

  <!-- USER PROMPT -->
  <div id="layerPrompt" class="user-prompt">
    <span class="close" onclick="this.parentElement.style.display='none'">×</span>
    <div class="prompt-arrow prompt-arrow-left"></div>
    <strong>Tip:</strong> Click the layers button (<span style="display:inline-block;width:20px;height:20px;background-image:url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTMgNkgxTTMgMTJIMU0zIDE4SDFNOCA2SDIxTTggMTJIMjFNOCAxOEgyMSIgc3Ryb2tlPSIjMDAwIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L3N2Zz4K');background-size:contain;"></span>) to toggle bus routes and stops.
  </div>
  
  <div id="legendPrompt" class="user-prompt">
    <span class="close" onclick="this.parentElement.style.display='none'">×</span>
    <div class="prompt-arrow prompt-arrow-top"></div>
    <strong>Tip:</strong> Click on the legend headers to expand/collapse sections and see route colors.
  </div>

  <!-- CONTACT INFORMATION -->
<div id="contactInfo" class="user-prompt" style="bottom: 10px; left: 10px; top: auto; right: auto; display: block;">
  <strong>Contact:</strong><br>
  <a href="mailto:thechechiamah@gmail.com">Email</a> | 
  <a href="https://www.linkedin.com/in/chechiamah" target="_blank">LinkedIn</a>
</div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- SCRIPTS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
